<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flow 6 — History &amp; Reporting</title>
<style>
  body { margin: 0; padding: 32px; background: #fff; display: flex; justify-content: center; align-items: flex-start; }
  svg { display: block; }
</style>
</head>
<body>
<svg width="560" height="80" viewBox="0 0 560 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Home (start) -->
  <rect x="0" y="20" width="80" height="40" rx="20" fill="#1A7B6F" stroke="#1A7B6F" stroke-width="1.5"/>
  <text x="40" y="44" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" font-family="Figtree, Inter, sans-serif">Home</text>
  <!-- Arrow -->
  <line x1="80" y1="40" x2="106" y2="40" stroke="#E0E0E4" stroke-width="1.5"/>
  <polygon points="110,40 104,36 104,44" fill="#E0E0E4"/>
  <!-- Menu -->
  <rect x="110" y="20" width="80" height="40" rx="8" fill="#fff" stroke="#E0E0E4" stroke-width="1.5"/>
  <text x="150" y="44" text-anchor="middle" font-size="11" font-weight="500" fill="#212638" font-family="Figtree, Inter, sans-serif">Menu</text>

  <!-- Branch to Transaction History -->
  <line x1="190" y1="30" x2="236" y2="20" stroke="#E0E0E4" stroke-width="1.5"/>
  <polygon points="240,18 234,14 234,22" fill="#E0E0E4"/>
  <!-- Branch to Terminal Reporting -->
  <line x1="190" y1="50" x2="236" y2="58" stroke="#E0E0E4" stroke-width="1.5"/>
  <polygon points="240,60 234,56 234,64" fill="#E0E0E4"/>

  <!-- Transaction History -->
  <rect x="240" y="0" width="150" height="40" rx="8" fill="#fff" stroke="#E0E0E4" stroke-width="1.5"/>
  <text x="315" y="24" text-anchor="middle" font-size="11" font-weight="500" fill="#212638" font-family="Figtree, Inter, sans-serif">Transaction History</text>
  <!-- Terminal Reporting -->
  <rect x="240" y="40" width="150" height="40" rx="8" fill="#fff" stroke="#E0E0E4" stroke-width="1.5"/>
  <text x="315" y="64" text-anchor="middle" font-size="11" font-weight="500" fill="#212638" font-family="Figtree, Inter, sans-serif">Terminal Reporting</text>

  <!-- Arrow from History -->
  <line x1="390" y1="20" x2="426" y2="20" stroke="#E0E0E4" stroke-width="1.5"/>
  <polygon points="430,20 424,16 424,24" fill="#E0E0E4"/>
  <!-- Arrow from Reporting -->
  <line x1="390" y1="60" x2="426" y2="60" stroke="#E0E0E4" stroke-width="1.5"/>
  <polygon points="430,60 424,56 424,64" fill="#E0E0E4"/>

  <!-- Search / Filter (action) -->
  <rect x="430" y="0" width="110" height="40" rx="8" fill="#1A7B6F15" stroke="#1A7B6F" stroke-width="1.5"/>
  <text x="485" y="24" text-anchor="middle" font-size="11" font-weight="500" fill="#212638" font-family="Figtree, Inter, sans-serif">Search / Filter</text>
  <!-- Txns / Items Tabs (action) -->
  <rect x="430" y="40" width="120" height="40" rx="8" fill="#1A7B6F15" stroke="#1A7B6F" stroke-width="1.5"/>
  <text x="490" y="64" text-anchor="middle" font-size="10" font-weight="500" fill="#212638" font-family="Figtree, Inter, sans-serif">Txns / Items Tabs</text>
</svg>
</body>
</html>
