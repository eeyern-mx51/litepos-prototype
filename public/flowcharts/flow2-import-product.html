<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flow 2 — Import Product</title>
<style>
  body { margin: 0; padding: 32px; background: #fff; display: flex; justify-content: center; align-items: flex-start; }
  svg { display: block; }
</style>
</head>
<body>
<svg width="700" height="100" viewBox="0 0 700 100" xmlns="http://www.w3.org/2000/svg">
  <!-- LitePOS Settings (start) -->
  <rect x="0" y="30" width="130" height="40" rx="20" fill="#1A7B6F" stroke="#1A7B6F" stroke-width="1.5"/>
  <text x="65" y="54" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" font-family="Figtree, Inter, sans-serif">LitePOS Settings</text>
  <!-- Arrow -->
  <line x1="130" y1="50" x2="156" y2="50" stroke="#E0E0E4" stroke-width="1.5"/>
  <polygon points="160,50 154,46 154,54" fill="#E0E0E4"/>
  <!-- Import Products -->
  <rect x="160" y="30" width="120" height="40" rx="8" fill="#fff" stroke="#E0E0E4" stroke-width="1.5"/>
  <text x="220" y="54" text-anchor="middle" font-size="11" font-weight="500" fill="#212638" font-family="Figtree, Inter, sans-serif">Import Products</text>
  <!-- Arrow -->
  <line x1="280" y1="50" x2="306" y2="50" stroke="#E0E0E4" stroke-width="1.5"/>
  <polygon points="310,50 304,46 304,54" fill="#E0E0E4"/>
  <!-- Start Scanning (action) -->
  <rect x="310" y="30" width="110" height="40" rx="8" fill="#1A7B6F15" stroke="#1A7B6F" stroke-width="1.5"/>
  <text x="365" y="54" text-anchor="middle" font-size="11" font-weight="500" fill="#212638" font-family="Figtree, Inter, sans-serif">Start Scanning</text>
  <!-- Arrow -->
  <line x1="420" y1="50" x2="446" y2="50" stroke="#E0E0E4" stroke-width="1.5"/>
  <polygon points="450,50 444,46 444,54" fill="#E0E0E4"/>
  <!-- Scan Barcode -->
  <rect x="450" y="30" width="110" height="40" rx="8" fill="#fff" stroke="#E0E0E4" stroke-width="1.5"/>
  <text x="505" y="54" text-anchor="middle" font-size="11" font-weight="500" fill="#212638" font-family="Figtree, Inter, sans-serif">Scan Barcode</text>
  <!-- Arrow -->
  <line x1="560" y1="50" x2="586" y2="50" stroke="#E0E0E4" stroke-width="1.5"/>
  <polygon points="590,50 584,46 584,54" fill="#E0E0E4"/>
  <!-- Review & Save (end) -->
  <rect x="590" y="30" width="100" height="40" rx="20" fill="#1A7B6F" stroke="#1A7B6F" stroke-width="1.5"/>
  <text x="640" y="54" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" font-family="Figtree, Inter, sans-serif">Review &amp; Save</text>
  <!-- Loop back dashed -->
  <text x="555" y="18" font-size="9" fill="#6B7084" font-family="Figtree, Inter, sans-serif" font-weight="600">or Scan Another</text>
  <path d="M 640 30 Q 640 10 590 10 Q 505 10 505 30" fill="none" stroke="#E0E0E4" stroke-width="1" stroke-dasharray="3,3"/>
</svg>
</body>
</html>
