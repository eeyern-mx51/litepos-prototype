<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flow 2 — Add Product</title>
<style>
  body { margin: 0; padding: 32px; background: #fff; display: flex; justify-content: center; align-items: flex-start; }
  svg { display: block; }
</style>
</head>
<body>
<svg width="750" height="200" viewBox="0 0 750 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Row 1 -->
  <!-- LitePOS Settings (start) -->
  <rect x="0" y="20" width="130" height="40" rx="20" fill="#1A7B6F" stroke="#1A7B6F" stroke-width="1.5"/>
  <text x="65" y="44" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" font-family="Figtree, Inter, sans-serif">LitePOS Settings</text>
  <!-- Arrow -->
  <line x1="130" y1="40" x2="166" y2="40" stroke="#E0E0E4" stroke-width="1.5"/>
  <polygon points="170,40 164,36 164,44" fill="#E0E0E4"/>
  <!-- Manage Products -->
  <rect x="170" y="20" width="130" height="40" rx="8" fill="#fff" stroke="#E0E0E4" stroke-width="1.5"/>
  <text x="235" y="44" text-anchor="middle" font-size="11" font-weight="500" fill="#212638" font-family="Figtree, Inter, sans-serif">Manage Products</text>
  <!-- Arrow -->
  <line x1="300" y1="40" x2="336" y2="40" stroke="#E0E0E4" stroke-width="1.5"/>
  <polygon points="340,40 334,36 334,44" fill="#E0E0E4"/>
  <!-- Product Catalog -->
  <rect x="340" y="20" width="120" height="40" rx="8" fill="#fff" stroke="#E0E0E4" stroke-width="1.5"/>
  <text x="400" y="44" text-anchor="middle" font-size="11" font-weight="500" fill="#212638" font-family="Figtree, Inter, sans-serif">Product Catalog</text>
  <!-- Arrow -->
  <line x1="460" y1="40" x2="496" y2="40" stroke="#E0E0E4" stroke-width="1.5"/>
  <polygon points="500,40 494,36 494,44" fill="#E0E0E4"/>
  <!-- Tap + FAB (action) -->
  <rect x="500" y="20" width="100" height="40" rx="8" fill="#1A7B6F15" stroke="#1A7B6F" stroke-width="1.5"/>
  <text x="550" y="44" text-anchor="middle" font-size="11" font-weight="500" fill="#212638" font-family="Figtree, Inter, sans-serif">Tap + FAB</text>
  <!-- Arrow -->
  <line x1="600" y1="40" x2="636" y2="40" stroke="#E0E0E4" stroke-width="1.5"/>
  <polygon points="640,40 634,36 634,44" fill="#E0E0E4"/>
  <!-- New Product -->
  <rect x="640" y="20" width="110" height="40" rx="8" fill="#fff" stroke="#E0E0E4" stroke-width="1.5"/>
  <text x="695" y="44" text-anchor="middle" font-size="11" font-weight="500" fill="#212638" font-family="Figtree, Inter, sans-serif">New Product</text>

  <!-- Row 2 — vertical arrow down -->
  <line x1="695" y1="60" x2="695" y2="86" stroke="#E0E0E4" stroke-width="1.5"/>
  <polygon points="695,90 691,84 699,84" fill="#E0E0E4"/>
  <!-- Fill form (wide action) -->
  <rect x="440" y="90" width="300" height="36" rx="8" fill="#1A7B6F15" stroke="#1A7B6F" stroke-width="1.5"/>
  <text x="590" y="112" text-anchor="middle" font-size="10" font-weight="500" fill="#212638" font-family="Figtree, Inter, sans-serif">Fill: Name, Price, Category, Photo, SKU</text>

  <!-- Row 3 — vertical arrow down -->
  <line x1="590" y1="126" x2="590" y2="148" stroke="#E0E0E4" stroke-width="1.5"/>
  <polygon points="590,152 586,146 594,146" fill="#E0E0E4"/>
  <!-- Save Product (end) -->
  <rect x="540" y="152" width="110" height="40" rx="20" fill="#1A7B6F" stroke="#1A7B6F" stroke-width="1.5"/>
  <text x="595" y="176" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" font-family="Figtree, Inter, sans-serif">Save Product</text>
</svg>
</body>
</html>
