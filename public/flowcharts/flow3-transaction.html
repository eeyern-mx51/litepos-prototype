<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flow 3 — Transaction Flow</title>
<style>
  body { margin: 0; padding: 32px; background: #fff; display: flex; justify-content: center; align-items: flex-start; }
  svg { display: block; }
</style>
</head>
<body>
<svg width="750" height="260" viewBox="0 0 750 260" xmlns="http://www.w3.org/2000/svg">
  <!-- Home (start) -->
  <rect x="310" y="0" width="100" height="40" rx="20" fill="#1A7B6F" stroke="#1A7B6F" stroke-width="1.5"/>
  <text x="360" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" font-family="Figtree, Inter, sans-serif">Home</text>

  <!-- Branch labels -->
  <text x="90" y="66" font-size="10" font-weight="600" fill="#1A7B6F" font-family="Figtree, Inter, sans-serif" text-anchor="middle">A: Products</text>
  <text x="360" y="66" font-size="10" font-weight="600" fill="#1A7B6F" font-family="Figtree, Inter, sans-serif" text-anchor="middle">B: Scan</text>
  <text x="620" y="66" font-size="10" font-weight="600" fill="#1A7B6F" font-family="Figtree, Inter, sans-serif" text-anchor="middle">C: Keypad</text>

  <!-- Arrow to Path A -->
  <line x1="310" y1="20" x2="154" y2="70" stroke="#E0E0E4" stroke-width="1.5"/>
  <polygon points="150,72 156,64 160,72" fill="#E0E0E4"/>
  <!-- Arrow to Path B -->
  <line x1="360" y1="40" x2="360" y2="66" stroke="#E0E0E4" stroke-width="1.5"/>
  <polygon points="360,70 356,64 364,64" fill="#E0E0E4"/>
  <!-- Arrow to Path C -->
  <line x1="410" y1="20" x2="566" y2="70" stroke="#E0E0E4" stroke-width="1.5"/>
  <polygon points="570,72 560,72 564,64" fill="#E0E0E4"/>

  <!-- Tap Product (action) -->
  <rect x="30" y="70" width="120" height="40" rx="8" fill="#1A7B6F15" stroke="#1A7B6F" stroke-width="1.5"/>
  <text x="90" y="94" text-anchor="middle" font-size="11" font-weight="500" fill="#212638" font-family="Figtree, Inter, sans-serif">Tap Product</text>
  <!-- Scan Barcode (action) -->
  <rect x="300" y="70" width="120" height="40" rx="8" fill="#1A7B6F15" stroke="#1A7B6F" stroke-width="1.5"/>
  <text x="360" y="94" text-anchor="middle" font-size="11" font-weight="500" fill="#212638" font-family="Figtree, Inter, sans-serif">Scan Barcode</text>
  <!-- Enter Amount (action) -->
  <rect x="560" y="70" width="120" height="40" rx="8" fill="#1A7B6F15" stroke="#1A7B6F" stroke-width="1.5"/>
  <text x="620" y="94" text-anchor="middle" font-size="11" font-weight="500" fill="#212638" font-family="Figtree, Inter, sans-serif">Enter Amount</text>

  <!-- Converge arrows to Basket -->
  <line x1="90" y1="110" x2="306" y2="145" stroke="#E0E0E4" stroke-width="1.5"/>
  <polygon points="310,147 302,147 304,140" fill="#E0E0E4"/>
  <line x1="360" y1="110" x2="360" y2="141" stroke="#E0E0E4" stroke-width="1.5"/>
  <polygon points="360,145 356,139 364,139" fill="#E0E0E4"/>
  <line x1="620" y1="110" x2="414" y2="145" stroke="#E0E0E4" stroke-width="1.5"/>
  <polygon points="410,147 416,140 418,148" fill="#E0E0E4"/>

  <!-- Basket / OrderBar -->
  <rect x="290" y="145" width="140" height="40" rx="8" fill="#fff" stroke="#E0E0E4" stroke-width="1.5"/>
  <text x="360" y="169" text-anchor="middle" font-size="11" font-weight="500" fill="#212638" font-family="Figtree, Inter, sans-serif">Basket / OrderBar</text>

  <!-- Arrow down -->
  <line x1="360" y1="185" x2="360" y2="206" stroke="#E0E0E4" stroke-width="1.5"/>
  <polygon points="360,210 356,204 364,204" fill="#E0E0E4"/>

  <!-- Payment Options (decision) -->
  <polygon points="360,210 440,233 360,256 280,233" fill="#FFF3E0" stroke="#FF9800" stroke-width="1.5"/>
  <text x="360" y="237" text-anchor="middle" font-size="10" font-weight="600" fill="#212638" font-family="Figtree, Inter, sans-serif">Payment Options</text>
</svg>
</body>
</html>
