<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flow 3 — Payment Methods</title>
<style>
  body { margin: 0; padding: 32px; background: #fff; display: flex; justify-content: center; align-items: flex-start; }
  svg { display: block; }
</style>
</head>
<body>
<svg width="700" height="120" viewBox="0 0 700 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Payment Options (decision) -->
  <polygon points="330,0 410,23 330,46 250,23" fill="#FFF3E0" stroke="#FF9800" stroke-width="1.5"/>
  <text x="330" y="27" text-anchor="middle" font-size="10" font-weight="600" fill="#212638" font-family="Figtree, Inter, sans-serif">Payment Options</text>

  <!-- Branch labels -->
  <text x="55" y="75" font-size="9" fill="#6B7084" font-family="Figtree, Inter, sans-serif" font-weight="600">Full amount</text>
  <text x="320" y="75" font-size="9" fill="#6B7084" font-family="Figtree, Inter, sans-serif" font-weight="600">Per item</text>
  <text x="595" y="75" font-size="9" fill="#6B7084" font-family="Figtree, Inter, sans-serif" font-weight="600">Per patron</text>

  <!-- Arrow to Pay in Full -->
  <line x1="250" y1="23" x2="114" y2="80" stroke="#E0E0E4" stroke-width="1.5"/>
  <polygon points="110,82 116,74 120,82" fill="#E0E0E4"/>
  <!-- Arrow to Split by Item -->
  <line x1="330" y1="46" x2="330" y2="76" stroke="#E0E0E4" stroke-width="1.5"/>
  <polygon points="330,80 326,74 334,74" fill="#E0E0E4"/>
  <!-- Arrow to Split Equally -->
  <line x1="410" y1="23" x2="546" y2="80" stroke="#E0E0E4" stroke-width="1.5"/>
  <polygon points="550,82 540,82 544,74" fill="#E0E0E4"/>

  <!-- Pay in Full (end) -->
  <rect x="0" y="80" width="110" height="40" rx="20" fill="#1A7B6F" stroke="#1A7B6F" stroke-width="1.5"/>
  <text x="55" y="104" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" font-family="Figtree, Inter, sans-serif">Pay in Full</text>
  <!-- Split by Item (end) -->
  <rect x="265" y="80" width="120" height="40" rx="20" fill="#1A7B6F" stroke="#1A7B6F" stroke-width="1.5"/>
  <text x="325" y="104" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" font-family="Figtree, Inter, sans-serif">Split by Item</text>
  <!-- Split Equally (end) -->
  <rect x="545" y="80" width="110" height="40" rx="20" fill="#1A7B6F" stroke="#1A7B6F" stroke-width="1.5"/>
  <text x="600" y="104" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" font-family="Figtree, Inter, sans-serif">Split Equally</text>
</svg>
</body>
</html>
