<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flow 1 — Enabling LitePOS</title>
<style>
  body { margin: 0; padding: 32px; background: #fff; display: flex; justify-content: center; align-items: flex-start; }
  svg { display: block; }
</style>
</head>
<body>
<svg width="680" height="80" viewBox="0 0 680 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Home (start) -->
  <rect x="0" y="20" width="100" height="40" rx="20" fill="#1A7B6F" stroke="#1A7B6F" stroke-width="1.5"/>
  <text x="50" y="44" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" font-family="Figtree, Inter, sans-serif">Home</text>
  <!-- Arrow -->
  <line x1="100" y1="40" x2="136" y2="40" stroke="#E0E0E4" stroke-width="1.5"/>
  <polygon points="140,40 134,36 134,44" fill="#E0E0E4"/>
  <!-- Menu -->
  <rect x="140" y="20" width="100" height="40" rx="8" fill="#fff" stroke="#E0E0E4" stroke-width="1.5"/>
  <text x="190" y="44" text-anchor="middle" font-size="11" font-weight="500" fill="#212638" font-family="Figtree, Inter, sans-serif">Menu</text>
  <!-- Arrow -->
  <line x1="240" y1="40" x2="276" y2="40" stroke="#E0E0E4" stroke-width="1.5"/>
  <polygon points="280,40 274,36 274,44" fill="#E0E0E4"/>
  <!-- Settings -->
  <rect x="280" y="20" width="100" height="40" rx="8" fill="#fff" stroke="#E0E0E4" stroke-width="1.5"/>
  <text x="330" y="44" text-anchor="middle" font-size="11" font-weight="500" fill="#212638" font-family="Figtree, Inter, sans-serif">Settings</text>
  <!-- Arrow -->
  <line x1="380" y1="40" x2="416" y2="40" stroke="#E0E0E4" stroke-width="1.5"/>
  <polygon points="420,40 414,36 414,44" fill="#E0E0E4"/>
  <!-- LitePOS Settings -->
  <rect x="420" y="20" width="130" height="40" rx="8" fill="#fff" stroke="#E0E0E4" stroke-width="1.5"/>
  <text x="485" y="44" text-anchor="middle" font-size="11" font-weight="500" fill="#212638" font-family="Figtree, Inter, sans-serif">LitePOS Settings</text>
  <!-- Arrow -->
  <line x1="550" y1="40" x2="586" y2="40" stroke="#E0E0E4" stroke-width="1.5"/>
  <polygon points="590,40 584,36 584,44" fill="#E0E0E4"/>
  <!-- Toggle ON (action) -->
  <rect x="590" y="20" width="90" height="40" rx="8" fill="#1A7B6F15" stroke="#1A7B6F" stroke-width="1.5"/>
  <text x="635" y="44" text-anchor="middle" font-size="11" font-weight="500" fill="#212638" font-family="Figtree, Inter, sans-serif">Toggle ON</text>
</svg>
</body>
</html>
